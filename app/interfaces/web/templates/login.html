{% extends "base.html" %}
{% from "_macros.html" import brand %}
{% block title %}Log in · CF Tracker{% endblock %}
{% block chrome %}{% endblock %}
{% block main %}
<main class="login">
  <div class="card login-card">
    {{ brand() }}
    <p class="muted">200 problems, one day at a time.</p>
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" autofocus required style="height:40px">
      </label>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button class="btn btn-primary" type="submit" style="height:40px">Log in</button>
    </form>
  </div>
</main>
{% endblock %}
